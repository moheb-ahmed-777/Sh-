<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12030d" />
  <title>I love you ❤️</title>

  <!-- الخطوط (اختيارية: لو ما فيه إنترنت، النظام يستخدم خطًا بديلًا) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Great+Vibes&display=swap"
    rel="stylesheet" />

  <!-- React + Babel من CDN: يكفي ملف واحد بدون build -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- مُثبّت على Babel 7: الإصدار 8 يجعل preset-react يستخدم JSX runtime تلقائيًا
       فيولّد import لا يعمل داخل سكربت عادي في المتصفح -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>

  <style>
    :root {
      --rose: #ff2d6f;
      --rose-soft: #ff86ad;
      --cream: #fff2f7;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #060109;
      color: #fff;
      font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #root {
      position: fixed;
      inset: 0;
    }

    /* ============ المشهد ============ */
    .app {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background:
        radial-gradient(88vmin 88vmin at 50% 44%, rgba(255, 45, 107, .17), transparent 62%),
        radial-gradient(70vmin 70vmin at 8% 92%, rgba(150, 60, 255, .14), transparent 66%),
        radial-gradient(65vmin 65vmin at 95% 6%, rgba(255, 140, 180, .10), transparent 62%),
        linear-gradient(158deg, #1c0514 0%, #12030d 46%, #060109 100%);
    }

    .app.is-revealed {
      cursor: pointer;
    }

    /* Vignette ناعمة فوق كل شيء (لا تحجب النقر) */
    .app::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(115% 85% at 50% 46%, transparent 42%, rgba(0, 0, 0, .62) 100%);
    }

    .rain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      text-align: center;
    }

    /* ============ الزر (الحالة الأولى) ============ */
    .cta-wrap {
      position: relative;
      display: grid;
      place-items: center;
      animation: fadeIn .7s ease both;
    }

    .cta-halo {
      position: absolute;
      left: -45%;
      top: -80%;
      width: 190%;
      height: 260%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 60, 120, .45) 0%, rgba(255, 60, 120, 0) 66%);
      filter: blur(16px);
      animation: halo 3.2s ease-in-out infinite;
    }

    .cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: .6em;
      padding: .95em 2.15em;
      font-family: inherit;
      font-size: clamp(1.02rem, 2.7vmin, 1.32rem);
      font-weight: 700;
      letter-spacing: .02em;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      background: linear-gradient(135deg, #ff4d7e 0%, #ff2d6f 46%, #c9184a 100%);
      box-shadow:
        0 12px 34px -10px rgba(255, 45, 107, .65),
        0 0 0 1px rgba(255, 255, 255, .05) inset,
        0 1px 0 rgba(255, 255, 255, .38) inset;
      cursor: pointer;
      overflow: hidden;
      transition: transform .22s cubic-bezier(.2, .9, .3, 1.4), box-shadow .3s ease, filter .3s ease;
      animation: floatIn .85s cubic-bezier(.2, .9, .25, 1) both;
    }

    .cta::before {
      content: "";
      position: absolute;
      top: 0;
      left: -140%;
      width: 55%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent);
      transform: skewX(-18deg);
      animation: sheen 4.8s ease-in-out 1.2s infinite;
      pointer-events: none;
    }

    .cta:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .cta:active {
      transform: translateY(0) scale(.975);
    }

    .cta:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .cta__icon {
      width: 1.15em;
      height: 1.15em;
      filter: drop-shadow(0 0 6px rgba(255, 200, 220, .8));
      animation: beat 1.6s ease-in-out infinite;
    }

    /* ============ الحالة الثانية (الكشف) ============ */
    .reveal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(0px, .6vmin, 8px);
    }

    .love-text {
      margin: 0 0 clamp(2px, 1vmin, 12px);
      font-family: "Great Vibes", "Segoe Script", "Brush Script MT", cursive;
      font-weight: 400;
      font-size: clamp(2.9rem, 12.5vmin, 7.4rem);
      line-height: 1.05;
      letter-spacing: .01em;
      background: linear-gradient(180deg, #ffffff 0%, #ffd9e5 34%, #ff86ad 72%, #ff3d71 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 20px rgba(255, 80, 140, .5)) drop-shadow(0 8px 30px rgba(255, 20, 80, .3));
      animation: riseIn .95s cubic-bezier(.2, .9, .2, 1) .1s both;
    }

    .heart-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(180px, 46vmin, 430px);
      aspect-ratio: 1 / 1;
      margin-top: clamp(-26px, -3vmin, -8px);
    }

    .heart-glow {
      position: absolute;
      left: -42.5%;
      top: -42.5%;
      width: 185%;
      height: 185%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle,
          rgba(255, 45, 107, .38) 0%,
          rgba(255, 45, 107, .16) 34%,
          rgba(255, 45, 107, 0) 68%);
      filter: blur(4px);
      animation: glowPulse 3.9s ease-in-out infinite;
    }

    .heart-shell {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      animation: popIn 1s cubic-bezier(.16, 1.05, .3, 1) both;
      filter: drop-shadow(0 16px 34px rgba(190, 20, 70, .45));
    }

    .heart {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      transform-origin: 50% 52%;
      animation: beat 1.9s ease-in-out 1s infinite;
    }

    .hint {
      margin: clamp(4px, 1.4vmin, 14px) 0 0;
      font-size: clamp(.74rem, 1.9vmin, .92rem);
      letter-spacing: .08em;
      color: rgba(255, 225, 235, .48);
      animation: fadeIn 1.1s ease 1.35s both;
    }

    /* ============ الحركات ============ */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(.32) rotate(-9deg);
      }

      62% {
        opacity: 1;
        transform: scale(1.07) rotate(2.5deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes beat {

      0%,
      100% {
        transform: scale(1);
      }

      11% {
        transform: scale(1.075);
      }

      21% {
        transform: scale(.995);
      }

      32% {
        transform: scale(1.045);
      }

      47% {
        transform: scale(1);
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes halo {

      0%,
      100% {
        opacity: .7;
        transform: scale(.94);
      }

      50% {
        opacity: 1;
        transform: scale(1.07);
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        opacity: .72;
        transform: scale(.95);
      }

      50% {
        opacity: 1;
        transform: scale(1.07);
      }
    }

    @keyframes sheen {

      0%,
      58% {
        left: -140%;
      }

      86%,
      100% {
        left: 150%;
      }
    }

    /* ============ شاشة الخطأ (لو فشل تحميل CDN) ============ */
    .fallback {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-content: center;
      gap: 8px;
      padding: 28px;
      text-align: center;
      background: #12030d;
      font-size: 15px;
      line-height: 1.9;
    }

    .fallback h2 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      color: #ff86ad;
    }

    .fallback p {
      margin: 0;
      max-width: 42ch;
      color: rgba(255, 235, 240, .72);
    }

    /* ============ احترام تفضيل تقليل الحركة ============ */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }

      .heart-glow,
      .cta-halo {
        opacity: .85;
      }
    }

    @media (max-height: 460px) {
      .love-text {
        font-size: clamp(2rem, 16vmin, 3rem);
      }

      .heart-stage {
        width: clamp(120px, 34vmin, 220px);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <noscript>
    <div class="fallback">
      <h2>JavaScript معطّل</h2>
      <p>فعّل JavaScript في المتصفح ثم أعد تحميل الصفحة لعرض القلب.</p>
    </div>
  </noscript>

  <div id="boot-error" class="fallback" hidden>
    <h2>تعذّر تحميل React</h2>
    <p>هذا الملف يحمّل React وBabel من الإنترنت. تأكد من الاتصال ثم أعد تحميل الصفحة.</p>
  </div>

  <script type="text/babel" data-presets="react">
    const { useCallback, useEffect, useRef, useState } = React;

    /* =========================================================
       1) الأساس المشترك: مسار القلب الوحيد
       نفس المسار يُستخدم في SVG (القلب الكبير)
       وفي Path2D (قلوب المطر) => تطابق بصري 100%
    ========================================================= */
    const HEART_PATH =
      "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3" +
      "c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5" +
      "c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";

    const PALETTE = ["#ff2f6d", "#ff5c8a", "#ff85a8", "#ffa8c0", "#ffd0dd", "#ff3f6e", "#e83e8c"];

    const SPRITE_BASE = 48;   // حجم القلب داخل الـ sprite (px)
    const SPRITE_PAD = 14;    // هامش للهالة المحيطة

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    function shade(hex, amount) {
      const n = parseInt(hex.slice(1), 16);
      const f = (v) => clamp(Math.round(v + v * amount), 0, 255);
      return "rgb(" + f((n >> 16) & 255) + "," + f((n >> 8) & 255) + "," + f(n & 255) + ")";
    }

    /* =========================================================
       2) Sprites: نرسم كل قلب مرة واحدة ثم نعيد استخدامه
       (أسرع بكثير من shadowBlur أو إنشاء Path في كل إطار)
    ========================================================= */
    const spriteCache = new Map();

    function getSprite(color) {
      if (spriteCache.has(color)) return spriteCache.get(color);

      const side = SPRITE_BASE + SPRITE_PAD * 2;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = side;

      const g = canvas.getContext("2d");
      const scale = SPRITE_BASE / 24;
      g.translate(SPRITE_PAD, SPRITE_PAD);
      g.scale(scale, scale);

      const path = new Path2D(HEART_PATH);

      // هالة خارجية ناعمة عبر خطوط متدرجة (بدل shadowBlur المكلف)
      g.lineJoin = "round";
      const halo = [[5.5, 0.09], [3.2, 0.15], [1.7, 0.24]];
      for (let i = 0; i < halo.length; i++) {
        g.globalAlpha = halo[i][1];
        g.strokeStyle = color;
        g.lineWidth = halo[i][0] / scale;
        g.stroke(path);
      }

      // جسم القلب بلمعة في الفص الأيسر
      g.globalAlpha = 1;
      const grad = g.createRadialGradient(9.4, 8.6, 0.6, 12, 12, 20);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.18, color);
      grad.addColorStop(1, shade(color, -0.42));
      g.fillStyle = grad;
      g.fill(path);

      const sprite = { canvas, ratio: side / SPRITE_BASE };
      spriteCache.set(color, sprite);
      return sprite;
    }

    function drawHeart(ctx, p) {
      const sprite = p.sprite;
      const d = p.size * sprite.ratio;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.drawImage(sprite.canvas, -d / 2, -d / 2, d, d);
      ctx.restore();
    }

    /* =========================================================
       3) Engine: مطر القلوب + الانفجار
       مستقل تمامًا عن React => سهل الاختبار والصيانة
    ========================================================= */
    function createEngine(canvas) {
      const ctx = canvas.getContext("2d");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let W = 0, H = 0;
      let raf = 0, last = 0;
      let running = false;
      let mode = "idle"; // idle | rain

      const rain = [];
      const bursts = [];

      function sizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.getBoundingClientRect();
        W = Math.max(1, rect.width);
        H = Math.max(1, rect.height);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function makeRainHeart(fromTop) {
        // طبقتان لعمق بصري: قلوب بعيدة كبيرة وباهتة وبطيئة + قلوب قريبة واضحة
        const back = Math.random() < 0.18;
        const size = back ? rand(46, 78) : rand(12, 34);
        return {
          sprite: getSprite(pick(PALETTE)),
          back,
          size,
          x: rand(-80, W + 80),
          y: fromTop ? rand(-H, -30) : H + rand(20, 140),
          vy: rand(38, 92) * (0.72 + size / 62) * (back ? 0.55 : 1),
          sway: rand(10, 30),
          freq: rand(0.5, 1.4),
          phase: rand(0, Math.PI * 2),
          t: rand(0, 12),
          rot: rand(-0.5, 0.5),
          vr: rand(-0.5, 0.5),
          alpha: back ? rand(0.10, 0.22) : rand(0.35, 0.92),
        };
      }

      function makeIdleHeart() {
        const size = rand(26, 66);
        return {
          sprite: getSprite(pick(PALETTE)),
          size,
          x: rand(0, W),
          y: H + rand(10, H * 0.7),
          vy: -rand(9, 22),
          sway: rand(8, 22),
          freq: rand(0.2, 0.6),
          phase: rand(0, Math.PI * 2),
          t: rand(0, 12),
          rot: rand(-0.3, 0.3),
          vr: rand(-0.18, 0.18),
          alpha: rand(0.07, 0.18),
        };
      }

      function retune() {
        if (mode === "rain") {
          const target = reduced ? 0 : clamp(Math.round((W * H) / 15000), 45, 160);
          while (rain.length < target) rain.push(makeRainHeart(false));
          if (rain.length > target) rain.length = target;
        } else {
          const target = clamp(Math.round((W * H) / 90000), 7, 20);
          while (rain.length < target) rain.push(makeIdleHeart());
          if (rain.length > target) rain.length = target;
        }
      }

      function step(dt) {
        ctx.clearRect(0, 0, W, H);

        // 1) تحديث المواضع وإعادة تدوير القلوب التي خرجت من الشاشة
        for (let i = 0; i < rain.length; i++) {
          const p = rain[i];
          p.t += dt;
          p.y += p.vy * dt;
          p.x += Math.cos(p.t * p.freq + p.phase) * p.sway * dt;
          p.rot += p.vr * dt;

          if (mode === "rain") {
            if (p.y - p.size * 0.7 > H) rain[i] = makeRainHeart(true);
          } else if (p.y + p.size * 0.7 < -20) {
            rain[i] = makeIdleHeart();
          }
        }

        // 2) الرسم على طبقتين: الخلفية الباهتة أولًا ثم القلوب القريبة
        for (let layer = 1; layer >= 0; layer--) {
          for (let i = 0; i < rain.length; i++) {
            const p = rain[i];
            if ((p.back ? 1 : 0) === layer) drawHeart(ctx, p);
          }
        }

        for (let i = bursts.length - 1; i >= 0; i--) {
          const b = bursts[i];
          b.life += dt;
          if (b.life >= b.ttl) { bursts.splice(i, 1); continue; }
          b.vy += 540 * dt;
          b.vx *= 1 - 1.15 * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.rot += b.vr * dt;
          const k = 1 - b.life / b.ttl;
          b.alpha = k * k * 0.95;
          b.size = b.size0 * (0.5 + 0.5 * k);
          drawHeart(ctx, b);
        }
      }

      function frame(ts) {
        if (!running) return;
        if (!last) last = ts;
        let dt = (ts - last) / 1000;
        last = ts;
        step(clamp(dt, 0, 0.05)); // حماية من القفزات عند رجوع التاب
        raf = requestAnimationFrame(frame);
      }

      function play() {
        if (reduced || running) return;
        running = true;
        last = 0;
        raf = requestAnimationFrame(frame);
      }

      function pause() {
        running = false;
        cancelAnimationFrame(raf);
      }

      function startRain(originX, originY) {
        if (reduced) { canvas.style.display = "none"; return; }
        mode = "rain";
        rain.length = 0;
        retune();
        // قلوب موجودة بالفعل في الشاشة => تأثير فوري بدون انتظار
        for (let i = 0; i < 22; i++) {
          const p = makeRainHeart(true);
          p.y = rand(-H * 0.12, H * 0.55);
          rain.push(p);
        }
        burst(originX, originY, 52);
        play();
      }

      function burst(x, y, count) {
        if (reduced) return;
        const n = count || 24;
        for (let i = 0; i < n; i++) {
          const angle = rand(0, Math.PI * 2);
          const speed = rand(110, 520);
          const size = rand(16, 42);
          bursts.push({
            sprite: getSprite(pick(PALETTE)),
            size,
            size0: size,
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - rand(40, 220),
            rot: rand(-0.4, 0.4),
            vr: rand(-3.2, 3.2),
            alpha: 1,
            life: 0,
            ttl: rand(1.1, 2.15),
          });
        }
      }

      let resizeTimer = 0;
      function onResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          sizeCanvas();
          retune();
        }, 140);
      }

      function onVisibility() {
        if (document.hidden) pause();
        else if (mode === "rain") play();
      }

      sizeCanvas();
      retune();
      window.addEventListener("resize", onResize);
      window.addEventListener("orientationchange", onResize);
      document.addEventListener("visibilitychange", onVisibility);

      return {
        startRain,
        burst,
        destroy() {
          pause();
          window.removeEventListener("resize", onResize);
          window.removeEventListener("orientationchange", onResize);
          document.removeEventListener("visibilitychange", onVisibility);
          spriteCache.clear();
        },
      };
    }

    /* =========================================================
       4) مكوّنات React
    ========================================================= */
    function HeartSvg() {
      return (
        <svg className="heart" viewBox="0 0 24 24" role="img" aria-label="قلب أحمر كبير">
          <defs>
            <linearGradient id="heartGrad" x1="0.12" y1="0.02" x2="0.88" y2="1">
              <stop offset="0%" stopColor="#ffb3c8" />
              <stop offset="28%" stopColor="#ff5c8a" />
              <stop offset="64%" stopColor="#ff2d6f" />
              <stop offset="100%" stopColor="#ad0f3b" />
            </linearGradient>
            <radialGradient id="heartShine" cx="0.35" cy="0.26" r="0.52">
              <stop offset="0%" stopColor="#ffffff" stopOpacity="0.85" />
              <stop offset="46%" stopColor="#ffffff" stopOpacity="0.16" />
              <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
            </radialGradient>
          </defs>
          <path d={HEART_PATH} fill="url(#heartGrad)" />
          <path d={HEART_PATH} fill="url(#heartShine)" />
        </svg>
      );
    }

    function App() {
      const canvasRef = useRef(null);
      const engineRef = useRef(null);
      const revealedRef = useRef(false);
      const [revealed, setRevealed] = useState(false);

      useEffect(() => {
        const engine = createEngine(canvasRef.current);
        engineRef.current = engine;
        window.__APP_MOUNTED__ = true;
        return () => {
          engine.destroy();
          engineRef.current = null;
          window.__APP_MOUNTED__ = false;
        };
      }, []);

      const reveal = useCallback((x, y) => {
        if (revealedRef.current) return;
        revealedRef.current = true;
        setRevealed(true);
        try {
          if (navigator.vibrate) navigator.vibrate([12, 40, 20]);
        } catch (_) { /* غير مدعوم => تجاهل */ }
        if (engineRef.current) engineRef.current.startRain(x, y);
      }, []);

      const handleButtonClick = useCallback((event) => {
        event.stopPropagation();
        const rect = event.currentTarget.getBoundingClientRect();
        reveal(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }, [reveal]);

      const handleSurfaceClick = useCallback((event) => {
        if (!revealedRef.current) return;
        if (engineRef.current) engineRef.current.burst(event.clientX, event.clientY, 16);
      }, []);

      return (
        <div
          className={"app" + (revealed ? " is-revealed" : "")}
          onClick={handleSurfaceClick}
        >
          <canvas ref={canvasRef} className="rain" aria-hidden="true" />

          <main className="stage">
            {!revealed && (
              <div className="cta-wrap">
                <span className="cta-halo" aria-hidden="true" />
                <button
                  type="button"
                  className="cta"
                  onClick={handleButtonClick}
                  autoFocus
                >
                  <svg className="cta__icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d={HEART_PATH} fill="currentColor" />
                  </svg>
                  <span>اضغط هنا</span>
                </button>
              </div>
            )}

            {revealed && (
              <div className="reveal">
                <h1 className="love-text">I love you Shrouk 💖</h1>
                <div className="heart-stage">
                  <span className="heart-glow" aria-hidden="true" />
                  <div className="heart-shell">
                    <HeartSvg />
                  </div>
                </div>
                <p className="hint">اضغط في أي مكان 💗</p>
              </div>
            )}
          </main>
        </div>
      );
    }

    const container = document.getElementById("root");
    ReactDOM.createRoot(container).render(<App />);
  </script>

  <script>
    // لو فشل تحميل React/Babel (بدون إنترنت) نظهر رسالة واضحة بدل شاشة سوداء
    setTimeout(function () {
      if (!window.__APP_MOUNTED__) {
        var el = document.getElementById("boot-error");
        if (el) el.hidden = false;
      }
    }, 8000);
  </script>
</body>

</html>
